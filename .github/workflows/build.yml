name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the Nix package and run offline tests
        run: nix build .#
      - name: Run GTK interface tests
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export XDG_CONFIG_HOME="$tmp/config" XDG_DATA_HOME="$tmp/data"
          export XDG_CACHE_HOME="$tmp/cache" XDG_STATE_HOME="$tmp/state"
          /usr/bin/dbus-run-session -- \
            nix develop -c env PYTHONPATH=linux:runtime GDK_BACKEND=x11 \
            xvfb-run -s "-screen 0 1600x1200x24" -a \
            python3 linux/tests/test_ui.py --safe-mode -v
      - name: Run GTK tray tests
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export XDG_CONFIG_HOME="$tmp/config" XDG_DATA_HOME="$tmp/data"
          export XDG_CACHE_HOME="$tmp/cache" XDG_STATE_HOME="$tmp/state"
          /usr/bin/dbus-run-session -- \
            nix develop -c env PYTHONPATH=linux:runtime GDK_BACKEND=x11 \
            xvfb-run -s "-screen 0 1600x1200x24" -a \
            python3 linux/tests/test_tray.py --safe-mode -v

  distro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the Debian package
        run: |
          mkdir -p build/packages
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/build:/out" \
            debian:stable sh -c '
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates dpkg-dev python3 &&
              python3 /src/tools/build-distro-packages.py prepare \
                --staging /out/staging &&
              python3 /src/tools/build-distro-packages.py deb \
                --staging /out/staging \
                --output /out/packages/zfly_0.2.0-1_amd64.deb &&
              apt-get install -y /out/packages/zfly_0.2.0-1_amd64.deb &&
              zfly --help &&
              /usr/lib/zfly/mihomo -v
            '
      - name: Build and install the Fedora package
        run: |
          mkdir -p build/packages
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/build:/out" \
            fedora:latest sh -c '
              dnf install -y ca-certificates rpm-build python3 &&
              python3 /src/tools/build-distro-packages.py rpm \
                --staging /out/staging \
                --output /out/packages/zfly-0.2.0-1.x86_64.rpm &&
              dnf install -y /out/packages/zfly-0.2.0-1.x86_64.rpm &&
              zfly --help &&
              /usr/lib/zfly/mihomo -v
            '
      - name: Generate checksums
        run: sha256sum build/packages/*.deb build/packages/*.rpm > build/packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zfly-linux-packages
          path: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: astral-sh/setup-uv@v5
      - name: Download core source and Geo data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/core-source build/flclash-host build/packages
          gh release download v0.2.0 \
            -p ZFly-0.2.0-core-source.tar.gz \
            -D build/dependencies --clobber
          tar -xzf build/dependencies/ZFly-0.2.0-core-source.tar.gz \
            -C build/core-source --strip-components=1
          mkdir -p build/flclash-host/assets/data
          for name in GEOIP.dat GEOSITE.dat GEOIP.metadb ASN.mmdb; do
            curl -fL --retry 3 \
              -H 'Accept: application/vnd.github.raw' \
              "https://api.github.com/repos/chen08209/FlClash/contents/assets/data/$name?ref=8d4f9744948751f1273fe871e1d05276fac09b0e" \
              -o "build/flclash-host/assets/data/$name"
          done
      - name: Install standalone Python
        run: uv python install 3.12
      - name: Build and test Swift packages
        run: |
          swift build --package-path macos
          swift test --package-path macos
      - name: Build the bundled core
        run: sh build/core-source/build.sh
      - name: Build and verify ZFly.app
        env:
          ZFLY_CORE: build/core-build/ZFlyCore
          ZFLY_CORE_KIND: ipc
          ZFLY_GEODATA: build/flclash-host/assets/data
          ZFLY_CORE_LICENSE: build/core-source/LICENSE
          ZFLY_MIHOMO_LICENSE: build/core-source/core/Clash.Meta/LICENSE
        run: |
          sh macos/build-app.sh
          python3 tools/verify-preview.py --app build/macos/ZFly.app
          python3 tools/verify-runtime.py --app build/macos/ZFly.app
      - name: Create and verify the DMG
        run: |
          hdiutil create \
            -volname ZFly \
            -srcfolder build/macos/ZFly.app \
            -ov -format UDZO \
            build/packages/ZFly-0.2.0-macos-arm64.dmg
          hdiutil verify build/packages/ZFly-0.2.0-macos-arm64.dmg
          shasum -a 256 build/packages/ZFly-0.2.0-macos-arm64.dmg \
            > build/packages/ZFly-0.2.0-macos-arm64.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zfly-macos-arm64
          path: |
            build/packages/ZFly-0.2.0-macos-arm64.dmg
            build/packages/ZFly-0.2.0-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
